<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>URPS Obésité</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    #onepage { position: relative; width: 100%; height: 100%; }
    .scene-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
    .scene-frame.is-active { display: block; }
  </style>
</head>
<body>
  <script>sessionStorage.setItem("urps_ob_single_page", "true");</script>
  <main id="onepage" aria-label="Parcours URPS Obésité">
    <iframe class="scene-frame" data-scene="hub" title="Accueil URPS Obésité" src="../URPS_Ob_HUB/index.html"></iframe>
    <iframe class="scene-frame" data-scene="blocA" title="Bloc A — Aménagement du cabinet" src="../URPS_Ob_blocA/index.html"></iframe>
    <iframe class="scene-frame" data-scene="blocB" title="Bloc B — Consultation contextualisée" src="../URPS_Ob_blocB/index.html"></iframe>
  </main>

  <script>
    (() => {
      const scenes = new Set(["hub", "blocA", "blocB"]);
      const labels = { hub: "Accueil", blocA: "Bloc A", blocB: "Bloc B" };
      const frames = [...document.querySelectorAll(".scene-frame")];

      function sceneFromUrl() {
        const scene = new URLSearchParams(window.location.search).get("scene");
        return scenes.has(scene) ? scene : "hub";
      }

      function showScene(scene, { replace = false } = {}) {
        const target = scenes.has(scene) ? scene : "hub";
        frames.forEach((frame) => frame.classList.toggle("is-active", frame.dataset.scene === target));
        const activeFrame = frames.find((frame) => frame.dataset.scene === target);
        activeFrame?.contentWindow?.postMessage({ type: "urps:scene-activated" }, window.location.origin);
        document.title = `URPS Obésité — ${labels[target]}`;

        const url = new URL(window.location.href);
        url.searchParams.set("scene", target);
        window.history[replace ? "replaceState" : "pushState"]({ scene: target }, "", url);
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.data?.type !== "urps:navigate") return;
        showScene(event.data.scene);
      });

      window.addEventListener("popstate", () => showScene(sceneFromUrl(), { replace: true }));
      showScene(sceneFromUrl(), { replace: true });
    })();
  </script>
</body>
</html>
